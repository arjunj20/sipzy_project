<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>500 - Server Error | Sipzy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --mouse-x: 50%;
            --mouse-y: 50%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: radial-gradient(
                circle at var(--mouse-x) var(--mouse-y), 
                rgba(162, 78, 52, 0.15) 0%, 
                rgba(26, 15, 10, 0) 50%
            ), linear-gradient(135deg, #1a0f0a 0%, #2d1810 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            color: #fff;
        }

        .dust-speck {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.3;
            animation: floatDust 10s infinite linear;
        }

        @keyframes floatDust {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-100px) translateX(20px); opacity: 0; }
        }

        .blob-1 {
            position: absolute;
            top: -20%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: rgba(162, 78, 52, 0.2);
            border-radius: 50%;
            filter: blur(120px);
            animation: float 8s ease-in-out infinite;
        }

        .blob-2 {
            position: absolute;
            bottom: -10%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: rgba(139, 35, 35, 0.2);
            border-radius: 50%;
            filter: blur(100px);
            animation: float 10s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(50px, 50px); }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 600px;
            padding: 60px 40px;
            background: linear-gradient(105deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid rgba(245, 158, 11, 0.3);
            background: rgba(245, 158, 11, 0.1);
            backdrop-filter: blur(10px);
            color: #f59e0b;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 30px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f59e0b;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        h1 {
            font-size: 120px;
            font-weight: 700;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            line-height: 1;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s backwards;
        }

        h2 {
            font-size: 28px;
            color: #fff;
            margin-bottom: 15px;
            font-weight: 600;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s backwards;
        }

        p {
            font-size: 16px;
            color: rgba(255,255,255,0.7);
            line-height: 1.6;
            margin-bottom: 40px;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s backwards;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s backwards;
        }

        .btn {
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: #A24E34;
            color: #fff;
            box-shadow: 0 10px 30px rgba(162, 78, 52, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 15px 40px rgba(162, 78, 52, 0.5);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }

        .icon {
            width: 18px;
            height: 18px;
        }

        .alert-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            color: #f59e0b;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.15s backwards, shake 3s infinite;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        @media (max-width: 768px) {
            .container {
                margin: 20px;
                padding: 40px 30px;
            }

            h1 {
                font-size: 80px;
            }

            h2 {
                font-size: 22px;
            }

            p {
                font-size: 14px;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="dust-speck" style="width: 4px; height: 4px; top: 20%; left: 15%; animation-delay: 0s;"></div>
    <div class="dust-speck" style="width: 6px; height: 6px; top: 60%; left: 25%; animation-delay: 2s;"></div>
    <div class="dust-speck" style="width: 4px; height: 4px; top: 40%; left: 70%; animation-delay: 4s;"></div>
    <div class="dust-speck" style="width: 5px; height: 5px; top: 80%; left: 85%; animation-delay: 6s;"></div>

    <div class="blob-1"></div>
    <div class="blob-2"></div>

    <div class="container">
        <svg class="alert-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
        
        <div class="error-badge">
            <span class="pulse-dot"></span>
            Server Error
        </div>

        <h1>500</h1>
        <h2>Something Spilled in the Cellar</h2>
        <p>Our servers are experiencing technical difficulties. Don't worry, our master distillers are working to restore everything to perfection. Please try again shortly.</p>

        <div class="btn-group">
            <a href="/" class="btn btn-primary">
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
                Return Home
            </a>
            
        </div>
    </div>

    <script>
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            
            const relativeX = (x / window.innerWidth) * 100;
            const relativeY = (y / window.innerHeight) * 100;
            
            document.body.style.setProperty('--mouse-x', `${relativeX}%`);
            document.body.style.setProperty('--mouse-y', `${relativeY}%`);
        });
    </script>
</body>
</html>
